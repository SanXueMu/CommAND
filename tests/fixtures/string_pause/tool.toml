[tool]
id = "tests.string.pause"
name = "暂停演示"
version = "1.0.0"
tags = ["文本", "开发"]
description = "退出码 4 演示任务级暂停（ToolPauseError）"

[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["text.raw[]"]
output_types = ["text.paused[]"]

[runtime]
kind = "subprocess"
entry = "python3 main.py"

[resources]
timeout_s = 60
concurrency = 4
max_attempts = 1
