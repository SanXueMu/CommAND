spring:
  flyway:
    enabled: false
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    locations: classpath:db/migration

command:
  clean:
    scheduler:
      enabled: false
      poll-interval: 1s
      worker-timeout: 30s
      job-poll-interval: 250ms
      job-timeout: 30m
      heartbeat-interval: 30s
      recovery-enabled: false
      stale-after: 5m
      recovery-batch-size: 50
      recovery-poll-interval: 30s
