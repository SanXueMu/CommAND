spring:
  datasource:
    url: ${COMMAND_DB_URL:jdbc:postgresql://localhost:5432/command_dev}
    username: ${COMMAND_DB_USERNAME:command_dev}
    password: ${COMMAND_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    locations: classpath:db/clean-migration
    schemas: command_runtime
    default-schema: command_runtime
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never

command:
  tools:
    llm:
      enabled: false
      base-url: ${COMMAND_LLM_BASE_URL:}
      api-key: ${COMMAND_LLM_API_KEY:}
      connect-timeout: 10s
      request-timeout: 120s
  clean:
    scheduler:
      enabled: false
      poll-interval: 1s
      worker-timeout: 30s
      job-poll-interval: 250ms
      job-timeout: 30m
      heartbeat-interval: 30s
      recovery-enabled: false
      stale-after: 5m
      recovery-batch-size: 50
      recovery-poll-interval: 30s
