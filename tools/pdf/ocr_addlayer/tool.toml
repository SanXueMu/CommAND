[tool]
id = "pdf.ocr.addlayer"
name = "PDF 补文字层"
version = "1.0.0"
tags = ["OCR", "文档"]
description = "扫描版 PDF 补隐形文字层（OCRmyPDF + Tesseract），产出可搜索 PDF；已含文字层则原样返回"

[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["file.pdf"]
output_types = ["file.pdf", "doc.searchable"]

[runtime]
kind = "inproc"
entry = "main.py:run"

[resources]
timeout_s = 1200
concurrency = 1
max_attempts = 1
