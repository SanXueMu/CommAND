[tool]
id = "pdf.pages.upright"
name = "页面转正"
version = "1.0.0"
tags = ["PDF", "预处理"]
description = "PDF 逐页方向转正（字符方向投票；180° 与无文字页不动，横版图纸识别前必经）"

[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["file.pdf"]
output_types = ["file.pdf"]

[runtime]
kind = "inproc"
entry = "main.py:run"

[resources]
timeout_s = 600
concurrency = 2
max_attempts = 2
