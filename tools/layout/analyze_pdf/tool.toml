[tool]
id = "layout.analyze.pdf"
name = "布局分析(非LLM)"
version = "1.0.0"
tags = ["布局", "PDF"]
description = "文本层PDF结构分析：表格线框/表头候选/字段标签/字体统计 → 布局描述（方案一前半）"

[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["file.pdf"]
output_types = ["ocr.layout"]

[runtime]
kind = "inproc"
entry = "main.py:run"

[resources]
timeout_s = 300
concurrency = 2
max_attempts = 2
