[tool]
id = "img.split.tiles"
name = "大图切块"
version = "1.0.0"
tags = ["图像", "预处理"]
description = "图/PDF 页 → 重叠瓦片 + 全局坐标（大幅面图纸小字保真；独立工具勿进管线）"

[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["file.pdf", "file.img"]
output_types = ["img.tiles"]

[runtime]
kind = "inproc"
entry = "main.py:run"

[resources]
timeout_s = 600
concurrency = 2
max_attempts = 2
