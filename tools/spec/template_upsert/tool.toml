[tool]
id = "spec.template.upsert"
name = "识别模版保存"
version = "1.0.0"
tags = ["模板", "识别", "管理"]
description = "识别规则模版新建/更新（整份校验：fields/prompt 占位/钩子可编译经 E1 轻校验）"


[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["ocr.template.query"]
output_types = ["ocr.template"]

[runtime]
kind = "inproc"
entry = "main.py:run"

[resources]
timeout_s = 30
concurrency = 4
max_attempts = 1
