[tool]
id = "spec.gen.vl"
name = "模板生成(多模态)"
version = "1.0.0"
tags = ["模板", "生成"]
description = "样例页图+需求 → 多模态LLM直读 → 识别三件套（方案二）"

[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["file.pdf", "file.img"]
output_types = ["ocr.spec"]

[runtime]
kind = "inproc"
entry = "main.py:run"

[resources]
timeout_s = 300
concurrency = 2
max_attempts = 2
