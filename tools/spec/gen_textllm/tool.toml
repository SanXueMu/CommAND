[tool]
id = "spec.gen.textllm"
name = "模板生成(纯语言)"
version = "1.0.0"
tags = ["模板", "生成"]
description = "布局描述+需求 → 纯语言LLM → 识别三件套（方案一后半）"

[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["ocr.layout"]
output_types = ["ocr.spec"]

[runtime]
kind = "inproc"
entry = "main.py:run"

[resources]
timeout_s = 300
concurrency = 2
max_attempts = 2
