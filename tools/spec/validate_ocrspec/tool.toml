[tool]
id = "spec.validate.ocrspec"
name = "三件套校验"
version = "1.0.0"
tags = ["模板", "校验"]
description = "TaskSpec/钩子/ViewSpec 合法性守门：钩子可编译、视图算子干跑、交叉引用警告"

[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["ocr.spec"]
output_types = ["ocr.spec.checked"]

[runtime]
kind = "inproc"
entry = "main.py:run"

[resources]
timeout_s = 120
concurrency = 2
max_attempts = 2
