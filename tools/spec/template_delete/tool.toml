[tool]
id = "spec.template.delete"
name = "识别模版删除"
version = "1.0.0"
tags = ["模板", "识别", "管理"]
description = "识别规则模版删除（物理删除文件，不可恢复）"


[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["ocr.template.query"]
output_types = ["ocr.template"]

[runtime]
kind = "inproc"
entry = "main.py:run"

[resources]
timeout_s = 30
concurrency = 4
max_attempts = 1
