[tool]
id = "records.export.csv"
name = "记录导出CSV"
version = "1.0.0"
tags = ["导出"]
description = "视图行 → CSV 文件（utf-8-sig，落 DATA_DIR/outputs/exports）"

[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["view.rows"]
output_types = ["file.csv"]

[runtime]
kind = "inproc"
entry = "main.py:run"

[resources]
timeout_s = 120
concurrency = 2
max_attempts = 2
