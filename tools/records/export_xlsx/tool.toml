[tool]
id = "records.export.xlsx"
name = "记录导出XLSX"
version = "1.0.0"
tags = ["导出"]
description = "视图行(+拆表) → 多 sheet XLSX 文件（落 DATA_DIR/outputs/exports）"

[io]
input_schema = "input.schema.json"
output_schema = "output.schema.json"
input_types = ["view.rows"]
output_types = ["file.xlsx"]

[runtime]
kind = "inproc"
entry = "main.py:run"

[resources]
timeout_s = 180
concurrency = 2
max_attempts = 2
