[project]
name = "command"
version = "0.1.0"
description = "CommAND — 小工具调度系统：协议立骨，注册为籍，队列作脉，管线成势"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "openai>=1.50",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "Pillow>=10.0",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
